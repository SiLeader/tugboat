[package]
name = "tugboat-apiserver"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
tugboat-resource-store.workspace = true
tugboat-resources = { workspace = true, features = ["schema"] }
tugboat-scheduler.workspace = true
tugboat-runtime-common.workspace = true

actix-tls = { version = "3.5.0", default-features = false, features = ["accept", "rustls-0_23"] }
actix-web = { workspace = true, features = ["rustls-0_23"] }
actix-web-lab.workspace = true
utoipa = { workspace = true, features = ["actix_extras"] }
utoipa-actix-web.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
ring.workspace = true
x509-parser.workspace = true
ed25519-dalek.workspace = true
pkcs8.workspace = true

serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
json_value_merge.workspace = true
jsonschema = { version = "0.51.0", default-features = false }

rand.workspace = true
rand_xorshift.workspace = true

tokio = { workspace = true, features = ["full"] }
async-stream.workspace = true
async-trait.workspace = true

uuid = { workspace = true, features = ["v4"] }

thiserror.workspace = true

clap = { workspace = true, features = ["derive"] }

tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-appender = "0.2.4"

toml.workspace = true
base64.workspace = true
sha2.workspace = true
chrono = { version = "0.4.44", features = ["serde"] }
bytes = "1.10.1"
futures-util = "0.3.32"
reqwest = { workspace = true, features = ["json"] }

[dev-dependencies]
tempfile.workspace = true
rcgen.workspace = true
