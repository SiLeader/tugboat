[node]
name = "node1"
# runtime_class = "kata"
network_probe_interval_seconds = 30

[topology]
region = "us-east"
zone = "us-east-a"

[runtime]
executable = "./target/debug/tugboat-qemu-runtime"
args = ["--config", "./sample-configs/runtime/config.toml"]

# Cloud Hypervisor runtime (alternative to QEMU)
# [runtime]
# executable = "/usr/bin/tugboat-cloud-hypervisor-runtime"
# args = ["--config", "/etc/tugboat/runtime/cloud-hypervisor-config.toml"]

[apiserver]
url = "https://apiserver:8443"

[apiserver.tls]
# CA certificate used to verify the apiserver TLS certificate.
ca_cert_path = "/etc/tugboat/pki/ca.crt"

[apiserver.auth]
# Use the mounted service account token when talking to an RBAC-enabled apiserver.
type = "service-account"
token_path = "/var/run/secrets/tugboat.cloud/serviceaccount/token"

[image]
cache_dir = "/tmp"

[cni]

[csi]
publish_dir = "/var/lib/tugboat-agent/csi"
socket_connect_timeout_seconds = 5
rpc_timeout_seconds = 30

[csi.drivers]
"hostpath.csi.k8s.io" = "/var/run/csi/csi.sock"
