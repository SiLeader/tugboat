[apiserver]
url = "http://apiserver:8080"

# [apiserver.auth]
# type = "service-account"
# token_path = "/var/run/secrets/tugboat.io/serviceaccount/token"

[scheduler]
name = "default-scheduler"
lease_duration_seconds = 15
renew_interval_seconds = 10
scheduling_interval_seconds = 1

[scheduler.plugins]
filter = ["NetworkFit", "TaintToleration", "RuntimeClassFit", "ResourceFit"]
score = ["TaintToleration", "LeastAllocated"]
