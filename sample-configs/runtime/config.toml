[qemu]
disk_image_location = "./test/data"
# Optional. Directory where ShipSnapshot artifacts are staged (one
# sub-directory per Ship). Defaults to /var/lib/tugboat/snapshots when
# absent. Stretch: this can be pointed at a CSI-mounted shared
# filesystem so snapshots survive node failure.
snapshot_dir = "/var/lib/tugboat/snapshots"

[qemu.executables]
qemu = "/usr/bin/qemu-system-x86_64"

[qemu.kvm]
enabled = false

[qemu.uefi]
code_file = "/usr/share/OVMF/OVMF_CODE_4M.fd"
vars_file = "/usr/share/OVMF/OVMF_VARS_4M.fd"
