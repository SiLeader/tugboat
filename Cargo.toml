[workspace]
members = [
    # control-plane components
    "tugboat-apiserver",
    "tugboat-resource-store",
    "tugboat-scheduler",
    "tugboat-controller-manager",
    # worker components
    "tugboat-agent",
    # runtimes
    "tugboat-qemu-runtime",
    "tugboat-cloud-hypervisor-runtime",
    "tugboat-runtime-common",
    # interfaces
    "tugboat-resources",
    "tugboat-vm-runtime-interface",
    # clients
    "tugboat-client",
    "tugboat-vm-image",
    # operators
    "tugboat-cni-operator",
    "tugboat-csi-operator",
    # misc
    "tugboat-cli",
    # tests
    "tests/integration",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
tugboat-resource-store = { path = "tugboat-resource-store" }
tugboat-resources = { path = "tugboat-resources" }
tugboat-client = { path = "tugboat-client" }
tugboat-vm-image = { path = "tugboat-vm-image" }
tugboat-vm-runtime-interface = { path = "tugboat-vm-runtime-interface" }
tugboat-runtime-common = { path = "tugboat-runtime-common" }
tugboat-cni-operator = { path = "tugboat-cni-operator" }
tugboat-csi-operator = { path = "tugboat-csi-operator" }
tugboat-scheduler = { path = "tugboat-scheduler" }

tugboat-apiserver = { path = "tugboat-apiserver" }
tugboat-controller-manager = { path = "tugboat-controller-manager" }

# command line
clap = "4.6.1"

# serde
serde = "1.0.228"
toml = "1.1.0"
serde_json = "1.0.149"
json_value_merge = "2.0.1"

# protobuf
tonic = "0.14.5"
prost = "0.14.3"
tonic-prost = "0.14.5"
prost-types = "0.14.3"
tonic-prost-build = "0.14.5"
prost-build = "0.14.3"

# async
tokio = "1.51.1"
async-trait = "0.1.89"
futures = "0.3.32"
async-stream = "0.3.6"
tokio-util = "0.7.18"

# tls
openssl = "0.10.78"

# rand
rand = "0.10.1"
rand_xorshift = "0.5.0"

# log
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

# HTTP server
actix-web = "4.13.0"
actix-web-lab = "0.26.0"
utoipa = "5.4.0"
utoipa-actix-web = "0.1.2"

# HTTP client
url = "2.5.8"
reqwest = "0.13.2"

# store
etcd-client = "0.18.0"

# OCI
oci-distribution = "0.11.0"
sha2 = "0.11.0"
flate2 = "1.1.9"

# QEMU
qapi = "0.15.0"

# misc
regex = "1.12.3"
thiserror = "2.0.18"
uuid = "1.23.0"
base64 = "0.22.1"
nix = "0.31.1"
dashmap = "6.1.0"

# testing
tempfile = "3.14.0"
