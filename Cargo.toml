[workspace]
members = ["resources", "tugboat-lowlevel-runtime"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
resources = { path = "./resources" }
tugboat-lowlevel-runtime = { path = "tugboat-lowlevel-runtime" }

# command line
clap = "4.5.53"

# serde
serde = "1.0.228"
toml = "0.9.8"

# async
tokio = "1.48.0"
async-trait = "0.1.89"

#
regex = "1.12.2"

thiserror = "2.0.17"

tracing = "0.1.44"
tracing-subscriber = "0.3.22"
