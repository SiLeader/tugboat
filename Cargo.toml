[workspace]
members = ["tugboat-resources", "tugboat-apiserver", "tugboat-agent", "tugboat-runtime", "tugboat-resource-store", "tugboat-client", "tugboat-cli", "tugboat-vm-image"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
tugboat-resource-store = { path = "tugboat-resource-store" }
tugboat-resources = { path = "tugboat-resources" }
tugboat-runtime = { path = "tugboat-runtime" }
tugboat-client = { path = "tugboat-client" }
tugboat-vm-image = { path = "tugboat-vm-image" }

# command line
clap = "4.5.53"

# serde
serde = "1.0.228"
toml = "0.9.8"
serde_json = "1.0.147"

# protobuf
prost = "0.14.1"
prost-build = "0.14.1"

# async
tokio = "1.48.0"
async-trait = "0.1.89"
futures = "0.3.31"
async-stream = "0.3.6"
tokio-util = "0.7.17"

# tls
rustls = "0.23.35"
rustls-pemfile = "2.2.0"

# misc
regex = "1.12.2"
thiserror = "2.0.17"
uuid = "1.19.0"
base64 = "0.22.1"

# rand
rand = "0.9.2"
rand_xorshift = "0.4.0"

# log
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

# HTTP server
actix-web = "4.12.1"
actix-web-lab = "0.24.3"
utoipa = "5.4.0"
utoipa-actix-web = "0.1.2"

# HTTP client
url = "2.5.7"

# store
etcd-client = "0.17.0"

# OCI
oci-distribution = "0.11.0"
sha2 = "0.10.9"

# QEMU
qapi-qmp = "0.15.0"
