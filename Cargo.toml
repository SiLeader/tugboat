[workspace]
members = ["tugboat-resources", "tugboat-apiserver", "tugboat-agent", "tugboat-runtime", "tugboat-resource-store"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
tugboat-resource-store = { path = "tugboat-resource-store" }
tugboat-resources = { path = "tugboat-resources" }
tugboat-runtime = { path = "tugboat-runtime" }

# command line
clap = "4.5.53"

# serde
serde = "1.0.228"
toml = "0.9.8"
serde_json = "1.0.147"

# protobuf
prost = "0.14.1"
prost-build = "0.14.1"

# async
tokio = "1.48.0"
async-trait = "0.1.89"
futures = "0.3.31"

# misc
regex = "1.12.2"
thiserror = "2.0.17"

# log
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

# HTTP server
actix-web = "4.12.1"
utoipa = "5.4.0"
utoipa-actix-web = "0.1.2"

# store
etcd-client = "0.17.0"
