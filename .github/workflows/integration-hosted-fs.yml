name: Integration (Hosted runner, Filesystem PVC)

on:
  workflow_dispatch:
  push:
    paths:
      - 'manifests/samples/**'

jobs:
  e2e-hosted-fs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip jq curl
          pip3 install pyyaml

      - name: Start Docker Compose
        run: |
          docker compose up -d --build

      - name: Wait for API server
        run: |
          until curl -sf http://localhost:8080/healthz; do sleep 2; done

      - name: Apply sample manifests (Filesystem-only PVC)
        run: |
          set -euo pipefail
          APISERVER_URL=http://localhost:8080
          SCRIPT_DIR="$GITHUB_WORKSPACE/manifests/samples"
          python3 .github/applier.py "${APISERVER_URL}" "$SCRIPT_DIR"

      - name: Verify Filesystem PVC is Bound
        run: |
          set -e
          sleep 2
          curl -s http://localhost:8080/api/v1/namespaces/demo/persistentvolumeclaims/data-disk-fs | jq '{"phase": .status.phase, "volumeName": .spec.volumeName}'

      - name: Teardown
        if: always()
        run: |
          docker compose down --volumes --remove-orphans
