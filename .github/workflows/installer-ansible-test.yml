name: installer-ansible-test

on:
  pull_request:
    paths:
      - 'installer/ansible/**'
      - '.github/workflows/installer-ansible-test.yml'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ansible
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible-core

      - name: Check playbook syntax
        shell: bash
        run: |
          cd installer/ansible
          ansible-playbook --syntax-check -i test/inventory.syntax.yml site.yml
          ansible-playbook --syntax-check -i test/inventory.syntax.yml uninstall.yml
