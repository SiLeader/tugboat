name: installer-systemd-test

on:
  pull_request:
    paths:
      - 'installer/systemd/**'
      - '.github/workflows/installer-systemd-test.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'tugboat-apiserver/**'
      - 'tugboat-agent/**'
      - 'tugboat-scheduler/**'
      - 'tugboat-controller-manager/**'
      - 'tugboat-qemu-runtime/**'
      - 'tugboat-cloud-hypervisor-runtime/**'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install shellcheck
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check shell syntax
        shell: bash
        run: |
          find installer/systemd -type f -name '*.sh' -print0 |
            xargs -0 -r bash -n

      - name: Run shellcheck
        shell: bash
        run: |
          shellcheck -x installer/systemd/*.sh installer/systemd/test/*.sh installer/systemd/test/scenarios/*.sh

  build-release-binaries:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache cargo dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-installer-systemd-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-installer-systemd-cargo-

      - name: Build release binaries
        shell: bash
        run: |
          cargo build --release --workspace --bins

      - name: Archive prebuilt release binaries
        shell: bash
        run: |
          mkdir -p installer/systemd/test/artifacts
          tar \
            -C target/release \
            -czf installer/systemd/test/artifacts/prebuilt-release-binaries.tar.gz \
            tugboat-apiserver \
            tugboat-agent \
            tugboat-scheduler \
            tugboat-controller-manager \
            tugboat-qemu-runtime \
            tugboat-cloud-hypervisor-runtime

      - name: Upload prebuilt release binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-systemd-prebuilt-release-binaries
          path: installer/systemd/test/artifacts/prebuilt-release-binaries.tar.gz
          if-no-files-found: error

  e2e-test:
    needs: build-release-binaries
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - 00-lib-unit
          - 01-control-plane-only
          - 02-worker-join
          - 03-flannel-bootstrap
          - 04-uninstall-purge
          - 05-tls-pki
          - 06-serviceaccount-rbac
          - 07-etcd-client-tls
          - 08-etcd-ha
          - 09-flanneld-daemon
          - 10-csi-hostpath
    timeout-minutes: 25
    env:
      TUGBOAT_TEST_PROJECT_NAME: tugboat-systemd-test-${{ matrix.scenario }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler shellcheck

      - name: Download prebuilt release binaries
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: installer-systemd-prebuilt-release-binaries
          path: installer/systemd/test/artifacts

      - name: Extract prebuilt release binaries
        shell: bash
        run: |
          mkdir -p target/release
          tar -C target/release -xzf installer/systemd/test/artifacts/prebuilt-release-binaries.tar.gz

      - name: Run scenario
        shell: bash
        run: |
          installer/systemd/test/run-tests.sh --scenario "${{ matrix.scenario }}" --use-prebuilt --keep

      - name: Collect docker compose logs
        if: always()
        shell: bash
        run: |
          mkdir -p installer/systemd/test/artifacts
          docker compose \
            -f installer/systemd/test/docker-compose.test.yml \
            -p "${TUGBOAT_TEST_PROJECT_NAME:-tugboat-systemd-test}" \
            logs --no-color > installer/systemd/test/artifacts/docker-compose.log 2>&1 || true

      - name: Upload installer test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-systemd-test-artifacts-${{ matrix.scenario }}
          path: installer/systemd/test/artifacts/
          if-no-files-found: ignore

      - name: Stop docker compose
        if: always()
        shell: bash
        run: |
          docker compose \
            -f installer/systemd/test/docker-compose.test.yml \
            -p "${TUGBOAT_TEST_PROJECT_NAME:-tugboat-systemd-test}" \
            down -v

  e2e-required:
    if: always()
    needs: e2e-test
    runs-on: ubuntu-24.04
    steps:
      - name: Require all e2e scenarios to pass
        shell: bash
        run: |
          if [[ "${{ needs.e2e-test.result }}" != "success" ]]; then
            echo "e2e-test result: ${{ needs.e2e-test.result }}" >&2
            echo "One or more installer-systemd e2e scenarios did not pass." >&2
            exit 1
          fi
