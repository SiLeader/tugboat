syntax = "proto3";

import "meta/v1/type_meta.proto";
import "meta/v1/object_meta.proto";
import "meta/v1/time.proto";

import "core/v1/secret.proto";

package tugboat.core.v1;

message PersistentVolumeClaim {
  meta.v1.TypeMeta type_meta = 1;
  meta.v1.ObjectMeta object_meta = 2;
  PersistentVolumeClaimSpec spec = 3;
  PersistentVolumeClaimStatus status = 4;
}

message PersistentVolumeClaimSpec {
  repeated string access_modes = 1;
  optional string storage_class_name = 2;
  optional string volume_mode = 3;
  optional string volume_name = 4;
  optional int64 requested_capacity_bytes = 5;
}

message PersistentVolumeClaimStatus {
  repeated PersistentVolumeClaimCondition conditions = 1;
  optional string phase = 2;
  optional int64 capacity_bytes = 3;
  optional bool resize_pending = 4;
}

message PersistentVolumeClaimCondition {
  string status = 1;
  string message = 2;
  meta.v1.Time timestamp = 3;
}
