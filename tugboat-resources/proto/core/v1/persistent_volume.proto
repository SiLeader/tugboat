syntax = "proto3";

import "meta/v1/type_meta.proto";
import "meta/v1/object_meta.proto";
import "meta/v1/time.proto";

import "core/v1/secret.proto";
import "core/v1/selector.proto";

package tugboat.core.v1;

message PersistentVolume {
  meta.v1.TypeMeta type_meta = 1;
  meta.v1.ObjectMeta object_meta = 2;
  PersistentVolumeSpec spec = 3;
  PersistentVolumeStatus status = 4;
}

message PersistentVolumeSpec {
  repeated string access_modes = 1;
  optional string persistent_volume_reclaim_policy = 2;
  optional string storage_class_name = 3;
  optional string volume_mode = 4;
  CsiPersistentVolumeSource csi = 5;
  PersistentVolumeClaimReference claim_ref = 6;
  optional int64 capacity_bytes = 7;
  VolumeNodeAffinity node_affinity = 8;
}

message VolumeNodeAffinity {
  NodeSelector required = 1;
}

message PersistentVolumeClaimReference {
  string name = 1;
  string namespace = 2;
}

message PersistentVolumeStatus {
  repeated PersistentVolumeCondition conditions = 1;
  optional string phase = 2;
  optional int64 capacity_bytes = 3;
  optional bool node_expansion_required = 4;
  optional string attached_node = 5;
}

message PersistentVolumeCondition {
  string status = 1;
  string message = 2;
  meta.v1.Time timestamp = 3;
}

message CsiPersistentVolumeSource {
  string driver = 1;
  SecretReference controller_expand_secret_ref = 2;
  SecretReference controller_publish_secret_ref = 3;
  SecretReference node_expand_secret_ref = 4;
  SecretReference node_publish_secret_ref = 5;
  SecretReference node_stage_secret_ref = 6;
  bool read_only = 7;
  string volume_handle = 8;
  optional string fs_type = 9;
  map<string, string> volume_attributes = 10;
  repeated string mount_options = 11;
  SecretReference controller_create_secret_ref = 12;
}
