syntax = "proto3";

import "meta/v1/type_meta.proto";
import "meta/v1/object_meta.proto";
import "meta/v1/time.proto";
import "core/v1/node.proto";

package tugboat.core.v1;

message ShipNetworkClassReference {
  string kind = 1;
  string name = 2;
  string api_group = 3;
}

message NetworkClass {
  meta.v1.TypeMeta type_meta = 1;
  meta.v1.ObjectMeta object_meta = 2;
  NetworkClassSpec spec = 3;
  optional NetworkClassStatus status = 4;
}

message ClusterNetworkClass {
  meta.v1.TypeMeta type_meta = 1;
  meta.v1.ObjectMeta object_meta = 2;
  NetworkClassSpec spec = 3;
  optional NetworkClassStatus status = 4;
}

message NetworkClassSpec {
  string subnet = 1;
  repeated NetworkClassRoute routes = 2;
  optional bool internet_access = 3;
  optional bool cluster_network = 4;
  string cni_plugin = 5;
  optional FlannelNetworkClass flannel = 6;
}

message NetworkClassRoute {
  string destination = 1;
}

message FlannelNetworkClass {
  string subnet_file = 1;
  string data_dir = 2;
  optional bool hairpin_mode = 3;
  optional bool default_gateway = 4;
  optional bool port_mappings = 5;
}

message NetworkClassStatus {
  repeated NetworkClassCondition conditions = 1;
  repeated string ready_nodes = 2;
  repeated NetworkClassNodePluginStatus nodes_status = 3;
}

message NetworkClassNodePluginStatus {
  string node_name = 1;
  repeated NodeCniPluginStatus plugins = 2;
}

message NetworkClassCondition {
  string type = 1;
  string status = 2;
  string message = 3;
  meta.v1.Time timestamp = 4;
}
