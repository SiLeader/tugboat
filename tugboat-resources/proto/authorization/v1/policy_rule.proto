syntax = "proto3";

package tugboat.authorization.v1;

message PolicyRule {
  repeated string api_groups = 1;
  repeated string resources = 2;
  repeated string resource_names = 3;
  repeated string verbs = 4;
}

message Subject {
  string kind = 1;
  string api_group = 2;
  string name = 3;
  optional string namespace = 4;
}

message RoleRef {
  string api_group = 1;
  string kind = 2;
  string name = 3;
}
