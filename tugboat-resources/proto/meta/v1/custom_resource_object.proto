syntax = "proto3";

import "meta/v1/object_meta.proto";
import "meta/v1/type_meta.proto";

package tugboat.meta.v1;

// CRD-defined resource storage envelope.
// raw_json contains the full JSON resource body: apiVersion, kind, metadata,
// spec, and status.
message CustomResourceObject {
  TypeMeta type_meta = 1;
  ObjectMeta object_meta = 2;
  bytes raw_json = 3;
}
