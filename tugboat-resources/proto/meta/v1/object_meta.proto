syntax = "proto3";

import "meta/v1/time.proto";

package tugboat.meta.v1;

message ObjectMeta {
  optional string name = 1;
  optional string generate_name = 2;
  optional string namespace = 3;
  optional string uid = 5;
  optional string resource_version = 6;
  optional int64 generation = 7;
  optional Time creation_timestamp = 8;
  optional Time deletion_timestamp = 9;
  map<string, string> labels = 11;
  map<string, string> annotations = 12;
  repeated OwnerReference owner_references = 13;
  repeated string finalizers = 14;
}

message OwnerReference {
  string api_version = 1;
  string kind = 2;
  string name = 3;
  string uid = 4;
  optional bool controller = 5;
}

message LabelSelector {
  map<string, string> match_labels = 1;
  repeated LabelSelectorRequirement match_expressions = 2;
}

message LabelSelectorRequirement {
  string key = 1;
  string operator = 2;
  repeated string values = 3;
}
