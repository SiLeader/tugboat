syntax = "proto3";

import "core/v1/secret.proto";
import "meta/v1/object_meta.proto";
import "meta/v1/type_meta.proto";

package tugboat.snapshot.v1;

message VolumeSnapshotClass {
  meta.v1.TypeMeta type_meta = 1;
  meta.v1.ObjectMeta object_meta = 2;
  VolumeSnapshotClassSpec spec = 3;
}

message VolumeSnapshotClassSpec {
  string driver = 1;
  string deletion_policy = 2;
  map<string, string> parameters = 3;
  core.v1.SecretReference snapshotter_secret_ref = 4;
}
