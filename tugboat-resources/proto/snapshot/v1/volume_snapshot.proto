syntax = "proto3";

import "meta/v1/object_meta.proto";
import "meta/v1/time.proto";
import "meta/v1/type_meta.proto";

package tugboat.snapshot.v1;

message VolumeSnapshot {
  meta.v1.TypeMeta type_meta = 1;
  meta.v1.ObjectMeta object_meta = 2;
  VolumeSnapshotSpec spec = 3;
  optional VolumeSnapshotStatus status = 4;
}

message VolumeSnapshotSpec {
  VolumeSnapshotSource source = 1;
  optional string volume_snapshot_class_name = 2;
}

message VolumeSnapshotSource {
  optional string persistent_volume_claim_name = 1;
  optional string volume_snapshot_content_name = 2;
}

message VolumeSnapshotStatus {
  optional string bound_volume_snapshot_content_name = 1;
  optional meta.v1.Time creation_time = 2;
  optional bool ready_to_use = 3;
  optional int64 restore_size_bytes = 4;
  repeated VolumeSnapshotCondition conditions = 5;
}

message VolumeSnapshotCondition {
  string type = 1;
  string status = 2;
  string message = 3;
  meta.v1.Time timestamp = 4;
}
