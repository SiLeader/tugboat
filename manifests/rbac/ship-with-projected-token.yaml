apiVersion: core/v1
kind: Ship
metadata:
  name: app-server
  namespace: default
spec:
  serviceAccountName: my-service-account
  automountServiceAccountToken: true
  # Explicit projected volume (optional, usually automatic)
  volumes:
    - name: custom-token
      projected:
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
              audience: https://vault.example.com
