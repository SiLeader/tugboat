# Ship defines a VM workload (analogous to a Pod in Kubernetes).
# The scheduler selects a Node with sufficient resources; the agent then starts the VM.
apiVersion: v1
kind: Ship
metadata:
  namespace: demo
  name: demo-ship
spec:
  image: ghcr.io/cerussite/tugboat/ubuntu:24.04
  shipClass: small
  networkClassRef:
    - kind: ClusterNetworkClass
      name: demo-network
      apiGroup: core
    - kind: NetworkClass
      name: internal-network
      apiGroup: core
  volumeClaimRef:
    - name: data-disk
  volumes:
    - name: data-disk
      persistentVolumeClaim:
        claimName: data-disk
    - name: app-config
      configMap:
        name: app-config
    - name: app-secret
      secret:
        secretName: app-secret
